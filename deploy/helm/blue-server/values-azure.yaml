# Azure 개발 환경 식별자 분리
global:
  environment: Production
  environmentName: azure-dev
  instanceName: blue-server-azure-dev

# ACR에 게시된 동일 Git SHA 기반 Application Image 고정
images:
  silo:
    repository: acrblueserverdevad7bd252.azurecr.io/blue-server-silo
    tag: ca5ab0fafb5d7f8bf9f3411333069f04ca44322e
    pullPolicy: IfNotPresent
  api:
    repository: acrblueserverdevad7bd252.azurecr.io/blue-server-api
    tag: ca5ab0fafb5d7f8bf9f3411333069f04ca44322e
    pullPolicy: IfNotPresent
  game:
    repository: acrblueserverdevad7bd252.azurecr.io/blue-server-game
    tag: ca5ab0fafb5d7f8bf9f3411333069f04ca44322e
    pullPolicy: IfNotPresent
  migration:
    repository: acrblueserverdevad7bd252.azurecr.io/blue-server-migrations
    tag: ca5ab0fafb5d7f8bf9f3411333069f04ca44322e
    pullPolicy: IfNotPresent

# AKS에서 접근할 Azure Managed PostgreSQL 연결 설정
database:
  host: psql-blue-server-dev-ad7bd252.postgres.database.azure.com
  port: 5432
  name: bluearchive
  user: blueadmin
  sslMode: VerifyFull

# Azure Managed Redis TLS와 Access Key 인증 설정
redis:
  host: redis-blue-server-dev-ad7bd252.koreacentral.redis.azure.net
  port: 10000
  ssl: true
  authentication:
    enabled: true
    secretKey: REDIS_PASSWORD

# ECK APM Server의 Cluster DNS, Token, 자체 서명 TLS 인증서 연결
observability:
  elasticApm:
    enabled: true
    serverUrl: https://blue-server-apm-http.observability.svc:8200
    environment: azure-dev
    transactionSampleRate: 1.0
    centralConfig: false
    openTelemetryBridgeEnabled: true
    captureBody: "off"
    credentials:
      existingSecretName: blue-server-apm-agent
      secretTokenKey: secret-token
      serverCertificateKey: tls.crt

# Azure 개발 환경 전용 Orleans Cluster 분리
orleans:
  clusterId: blue-server-azure-dev
