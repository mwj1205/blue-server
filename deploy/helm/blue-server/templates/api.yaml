{{- if .Values.api.enabled }}
# Cluster 내부 API 접근을 위한 Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue-server.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blue-server.apiLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "blue-server.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blue-server.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blue-server.apiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "blue-server.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blue-server.apiLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            # ASP.NET Core HTTP listener 설정
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: APP_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.api.containerPort | quote }}
            # PostgreSQL 연결 설정
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingName }}
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);GSS Encryption Mode=Disable
            # Redis refresh token 및 Orleans membership 연결 설정
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: REDIS_PORT
            - name: ConnectionStrings__Redis
              value: $(REDIS_HOST):$(REDIS_PORT),abortConnect=false
            - name: ConnectionStrings__OrleansRedis
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: ORLEANS_REDIS_CONNECTION_STRING
            - name: Orleans__Enabled
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: ORLEANS_ENABLED
            - name: Orleans__ClusteringMode
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: ORLEANS_CLUSTERING_MODE
            - name: Orleans__ClusterId
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: ORLEANS_CLUSTER_ID
            - name: Orleans__ServiceId
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: ORLEANS_SERVICE_ID
            # JWT 검증 및 발급 설정
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingName }}
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: JWT_AUDIENCE
            - name: Jwt__AccessTokenDays
              valueFrom:
                configMapKeyRef:
                  name: {{ include "blue-server.configMapName" . }}
                  key: JWT_ACCESS_TOKEN_DAYS
          # HTTP listener 상태 확인
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: {{ .Values.api.temporaryStorageLimit | quote }}
{{- end }}
