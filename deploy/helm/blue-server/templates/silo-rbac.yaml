{{- if .Values.orleans.enabled }}
# Orleans Kubernetes hosting을 위한 Pod 조회 및 관리 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blue-server.siloServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blue-server.siloLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "blue-server.siloName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blue-server.siloLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "blue-server.siloName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blue-server.siloLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "blue-server.siloServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "blue-server.siloName" . }}
{{- end }}
