apiVersion: v1
kind: Service
metadata:
  name: blue-server-api
  namespace: blue-server
  labels:
    app.kubernetes.io/name: blue-server-api
    app.kubernetes.io/instance: blue-server-local
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: blue-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blue-server-api
    app.kubernetes.io/instance: blue-server-local
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-server-api
  namespace: blue-server
  labels:
    app.kubernetes.io/name: blue-server-api
    app.kubernetes.io/instance: blue-server-local
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: blue-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blue-server-api
      app.kubernetes.io/instance: blue-server-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blue-server-api
        app.kubernetes.io/instance: blue-server-local
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: blue-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: blue-server-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: APP_ENVIRONMENT
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blue-server-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);GSS Encryption Mode=Disable
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: REDIS_PORT
            - name: ConnectionStrings__Redis
              value: $(REDIS_HOST):$(REDIS_PORT),abortConnect=false
            - name: ConnectionStrings__OrleansRedis
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: ORLEANS_REDIS_CONNECTION_STRING
            - name: Orleans__Enabled
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: ORLEANS_ENABLED
            - name: Orleans__ClusteringMode
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: ORLEANS_CLUSTERING_MODE
            - name: Orleans__ClusterId
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: ORLEANS_CLUSTER_ID
            - name: Orleans__ServiceId
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: ORLEANS_SERVICE_ID
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: blue-server-secrets
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: JWT_AUDIENCE
            - name: Jwt__AccessTokenDays
              valueFrom:
                configMapKeyRef:
                  name: blue-server-config
                  key: JWT_ACCESS_TOKEN_DAYS
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
