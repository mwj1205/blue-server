apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: blue-server
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: blue-server-local
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: blue-server
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: blue-server-local
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: blue-server
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: blue-server-local
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: blue-server
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: blue-server-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: blue-server-local
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: blue-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: blue-server-local
          app.kubernetes.io/part-of: blue-server
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
