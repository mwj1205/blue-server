name: blue-server

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bluearchive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: src/blueServer.Migrations/Dockerfile
    image: blue-server-migrations:local
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluearchive};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  silo-1:
    build:
      context: .
      dockerfile: src/Orleans/blueServer.Silo/Dockerfile
    image: blue-server-silo:local
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluearchive};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__OrleansRedis: redis:6379,abortConnect=false
      Orleans__ClusteringMode: Redis
      Orleans__ClusterId: ${ORLEANS_CLUSTER_ID:-blue-server-local}
      Orleans__ServiceId: ${ORLEANS_SERVICE_ID:-blue-server}
      Orleans__SiloName: blue-server-silo-1
      Orleans__AdvertisedHost: silo-1
      Orleans__SiloPort: ${ORLEANS_SILO_PORT:-11111}
      Orleans__GatewayPort: ${ORLEANS_GATEWAY_PORT:-30000}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - port_hex=$$(printf '%04X' "$${Orleans__GatewayPort}") && grep -q 00000000:$${port_hex}.*00000000:0000.*0A /proc/net/tcp
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped

  silo-2:
    build:
      context: .
      dockerfile: src/Orleans/blueServer.Silo/Dockerfile
    image: blue-server-silo:local
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluearchive};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__OrleansRedis: redis:6379,abortConnect=false
      Orleans__ClusteringMode: Redis
      Orleans__ClusterId: ${ORLEANS_CLUSTER_ID:-blue-server-local}
      Orleans__ServiceId: ${ORLEANS_SERVICE_ID:-blue-server}
      Orleans__SiloName: blue-server-silo-2
      Orleans__AdvertisedHost: silo-2
      Orleans__SiloPort: ${ORLEANS_SILO_PORT:-11111}
      Orleans__GatewayPort: ${ORLEANS_GATEWAY_PORT:-30000}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - port_hex=$$(printf '%04X' "$${Orleans__GatewayPort}") && grep -q 00000000:$${port_hex}.*00000000:0000.*0A /proc/net/tcp
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/blueServer.Api/Dockerfile
    image: blue-server-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluearchive};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__OrleansRedis: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-blueServer}
      Jwt__Audience: ${JWT_AUDIENCE:-blueServer}
      Jwt__AccessTokenDays: ${JWT_ACCESS_TOKEN_DAYS:-7}
      Orleans__Enabled: "true"
      Orleans__ClusteringMode: Redis
      Orleans__ClusterId: ${ORLEANS_CLUSTER_ID:-blue-server-local}
      Orleans__ServiceId: ${ORLEANS_SERVICE_ID:-blue-server}
    ports:
      - "${API_PORT:-5201}:8080"
    labels:
      blue_server_logs: api
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      silo-1:
        condition: service_healthy
      silo-2:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  game:
    build:
      context: .
      dockerfile: src/blueServer.Game/Dockerfile
    image: blue-server-game:local
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluearchive};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__OrleansRedis: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-blueServer}
      Jwt__Audience: ${JWT_AUDIENCE:-blueServer}
      Jwt__AccessTokenDays: ${JWT_ACCESS_TOKEN_DAYS:-7}
      Orleans__Enabled: "true"
      Orleans__ClusteringMode: Redis
      Orleans__ClusterId: ${ORLEANS_CLUSTER_ID:-blue-server-local}
      Orleans__ServiceId: ${ORLEANS_SERVICE_ID:-blue-server}
    ports:
      - "${GAME_PORT:-7777}:7777"
    labels:
      blue_server_logs: game
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      silo-1:
        condition: service_healthy
      silo-2:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
