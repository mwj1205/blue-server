name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore blueServer.slnx

      - name: Build
        run: dotnet build blueServer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/blueServer.Game.Tests/blueServer.Game.Tests.csproj --configuration Release --no-build --verbosity normal
