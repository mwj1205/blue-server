name: Azure OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # main Merge 전 OIDC 검증을 위한 임시 Feature Branch Trigger
      - terraform-azure-infrastructure
    paths:
      - .github/workflows/azure-oidc.yml
      - infra/terraform/azure/github-actions-identity.tf

permissions:
  contents: read

jobs:
  verify-azure-login:
    name: Verify Azure login
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/terraform-azure-infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # GitHub OIDC Token 발급에 필요한 최소 Workflow 권한
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify resource group access
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query '{name:name, location:location, provisioningState:properties.provisioningState}' \
            --output table
